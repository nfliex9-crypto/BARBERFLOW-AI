services:
  barberflow:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${APP_SECRET:?Generate APP_SECRET first}
      BF_DATA_DIR: /data
      BF_OUTPUT_WIDTH: "1080"
      BF_OUTPUT_HEIGHT: "1920"
      BF_WORKERS: "2"
    volumes:
      - ./media:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
