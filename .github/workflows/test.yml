name: BarberFlow Quality Gate
on:
  push:
    branches: [Bot, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install system video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install requirements
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Python and browser JavaScript checks
        run: |
          python -m compileall -q app
          node --check app/static/app.js
      - name: Real MP4 integration suite
        run: pytest -q
